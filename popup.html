<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WordNest</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand-row">
      <img class="brand-mark" src="icons/icon48.png" alt="" />
      <div class="brand-text">
        <h1>WordNest</h1>
        <p class="subtitle" id="count">0 words saved</p>
      </div>
    </div>

    <input type="search" id="search" class="field" placeholder="Search your words…" autocomplete="off" />
    <input type="text" id="manual-word" class="field" placeholder="Or type a word and press Enter" autocomplete="off" />
  </header>

  <main id="list" class="list"></main>

  <div id="empty-state" class="empty-state" hidden>
    <p class="empty-title">No words yet</p>
    <p class="empty-hint">Select a word on any page, right-click, and choose <strong>“Save to WordNest.”</strong></p>
  </div>

  <footer class="app-footer">
    <button id="export-json" class="link-btn" type="button">Export JSON</button>
    <span class="dot">·</span>
    <button id="export-csv" class="link-btn" type="button">Export CSV</button>
    <span class="dot">·</span>
    <button id="clear-all" class="link-btn danger" type="button">Clear all</button>
  </footer>

</div>
<script src="popup.js"></script>
</body>
</html>
